head_neck:
  - "Head and neck tissue may show squamous mucosa, salivary structures, lymphoid tissue, vessels, and fibrous stroma."
  - "Prioritize visible architecture and cytology before inferring lesion type."
breast:
  - "Breast tissue may contain ducts, lobules, adipose tissue, fibrous stroma, and blood vessels."
  - "Distinguish vascular lumens from ductal or glandular spaces by wall thickness, lining, and surrounding stroma."
skin:
  - "Skin may show epidermis, adnexal structures, dermis, vessels, inflammation, and keratinization."
