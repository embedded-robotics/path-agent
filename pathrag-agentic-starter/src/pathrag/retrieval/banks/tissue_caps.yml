lung:
  - "Lung tissue may show alveolar spaces, bronchiolar epithelium, vessels, inflammation, and fibrosis."
  - "Describe visible architecture first before assigning a tumor subtype."
gastrointestinal:
  - "Gastrointestinal tissue may show glands, mucosa, muscularis, lamina propria, vessels, and mucin."
  - "Separate native glandular architecture from vascular or stromal structures using visible morphology."
genitourinary:
  - "Genitourinary tissue may contain tubules, papillary structures, smooth muscle, vessels, and stromal elements."
  - "Use only visible morphology when deciding whether a structure is epithelial, stromal, or vascular."
gynecologic:
  - "Gynecologic tissue may show squamous epithelium, glandular epithelium, smooth muscle, stroma, and vessels."
  - "Base interpretation on architecture and cytology that are directly visible in the crop."
soft_tissue:
  - "Soft tissue may show spindle cells, collagen, myxoid matrix, adipose tissue, vessels, and inflammation."
  - "Assess whether the dominant pattern is stromal, vascular, inflammatory, or cellular before naming entities."
hematolymphoid:
  - "Hematolymphoid tissue may show sheets of lymphoid cells, mixed inflammation, sinuses, vessels, and stromal fragments."
  - "Describe cell distribution and background features before inferring a specific lymphoid diagnosis."
